[project]
name = "careersignal"
version = "0.1.0"
description = "CareerSignal job alert and ATS data collection project"
requires-python = ">=3.10"
dependencies = [
    "openpyxl",
    "pandas",
    "python-dotenv",
    "requests",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"